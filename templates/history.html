{% extends "base.html" %}
{% block content %}
<h2>Trekking History</h2>
<table>
    <tr><th>Trek Name</th><th>Trek Dates</th><th>Completed On</th><th>Status</th></tr>
    {% for b in bookings %}
    <tr><td>{{ b.trek_name }}</td><td>{{ b.start_date }} - {{ b.end_date }}</td><td>{{ b.end_date }}</td><td>{{ b.status }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
