{% extends "base.html" %}
{% block content %}
<h2>Users</h2>
<form method="get" class="field"><input name="q" value="{{ q }}" placeholder="Search User by Name or Email"></form>
<table>
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Contact</th><th>Status</th><th>Action</th></tr>
    {% for u in users %}
    <tr><td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.contact }}</td>
    <td>{{ 'Blacklisted' if u.blacklisted else 'Active' }}</td>
    <td><a class="btn btn-small btn-red" href="{{ url_for('blacklist_user', user_id=u.id) }}">Blacklist</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
