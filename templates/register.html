{% extends "base.html" %}

{% block public_content %}

<div class="container">
    <h1 style="text-align: center; text-decoration: solid;">Register</h1>
    <form method="post">
        <div class="field"><input name="name" placeholder="Enter your Full Name" required></div>
        <div class="field"><input name="email" placeholder="Enter your Email" required></div>
        <div class="field"><input name="password" type="password" placeholder="Enter Your Password" required></div>
        <div class="field"><input name="contact" placeholder="Enter Your Mobile No." required></div>
        <div class="field">
            <select name="role" required>
            <option value="">--Select Role--</option>
            <option value="user">User</option>
            <option value="staff">Staff</option>
            </select>
        </div>
        <div class="field"><button style="width: auto;">Register</button></div>

    </form>
    <p style="text-align: center; color: rgb(236, 102, 122);">Already Have Account? <a href="{{ url_for('login') }}">Login Here</a></p>
</div>
{% endblock %}
