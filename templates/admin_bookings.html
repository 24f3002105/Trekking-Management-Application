{% extends "base.html" %}
{% block content %}
<h2>All Boookings and History</h2>
<table>
    <tr><th>Booking ID</th><th>User</th><th>Trek</th><th>Date</th><th>Status</th><th>Payment</th></tr>
    {% for b in bookings %}
    <tr><td>{{ b.id }}</td><td>{{ b.user_name }}</td><td>{{ b.trek_name }}</td><td>{{ b.booking_date }}</td><td>{{ b.status }}</td><td>{{ b.payment_status }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
